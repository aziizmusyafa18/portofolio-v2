name: Sync AI project descriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: sync-project-ai-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate descriptions with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-project-ai.mjs > ai-projects.json

      - name: Commit generated descriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-projects.json
          if git diff --cached --quiet; then
            echo "No generated description changes to push."
            exit 0
          fi
          git commit -m "chore: sync AI project descriptions"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! GIT_EDITOR=true git rebase origin/main; then
              git checkout --theirs -- ai-projects.json
              git add ai-projects.json
              GIT_EDITOR=true git -c sequence.editor=true rebase --continue
            fi
            if git push origin HEAD:main; then
              echo "Generated descriptions pushed successfully."
              exit 0
            fi
            echo "Remote changed during push; retrying ($attempt/5)..."
            sleep 2
          done
          echo "Unable to push after 5 attempts."
          exit 1
